rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: |
      No polling
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: |
      Integration does not provide conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: |
      Integration does not provide triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name:
    status: done
    comment: |
      Not true on this tree until upstream 820cf52 is decided (Lukas's call):
      scene.py and weather.py set _attr_has_entity_name = False. The status
      is left at done on purpose; change it only with that decision.
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info: done
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: todo
  dynamic-devices:
    status: todo
    comment: |
      Zones, partitions and automation devices added on the panel only appear
      after a reload; only a new automation-device sensor is added while
      running.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: |
      All entities are considered useful
  entity-translations:
    status: todo
    comment: |
      Only sensor and binary sensor entities use translation keys; the other
      platforms set hard-coded English names.
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: |
      Connection and authentication failures are surfaced through
      ConfigEntryNotReady and ConfigEntryAuthFailed. Three repair issues cover
      the conditions a person has to act on: users.conf holds no codes, some
      of its rows are malformed, and a zone the panel has not listed for seven
      days (stale_devices.py).
  stale-devices:
    status: done
    comment: |
      Never automatic. A zone, partition or automation device the panel no
      longer lists can be deleted from its device page
      (async_remove_config_entry_device), and a zone missing for seven days of
      consistent readings raises a repair that points there. Upstream's
      delete-on-every-reload pass is deliberately not taken: one partial or
      empty zone table would remove every zone device.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: |
      Integration does not make any HTTP requests.
  strict-typing:
    status: done
    comment: |
      mypy.ini sets strict = True for the integration and its tests. The
      vendored qolsys_controller library itself is not type-checked
      (mypy.ini ignores errors in vendor.*); the integration's call sites
      into it are.
